name: aot

# AOT 兼容矩阵（参考 NewLife.Core 做法）：分析器零告警 + 三工程 NativeAOT 冒烟。
#   NativeAOT 不支持跨 OS 编译，每个 RID 用对应原生 runner 发布运行：
#     win-x64 → windows-latest；linux-x64 → ubuntu-latest；linux-arm64 → ubuntu-24.04-arm
#   linux-loongarch64（LA64）：无 runtime pack、无 NativeAOT，QEMU 下以 JIT 姿态跑冒烟（观察期）
# 触发：push / PR / 手动（workflow_dispatch）；不采用夜间定时。

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  # 分析器零告警（与 RID 无关）与源生成器单测，win-x64 硬约束
  aot-analyzer:
    name: aot analyzer (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: 分析器零告警构建（-warnaserror 阻断新增告警）
      run: |
        dotnet build NewLife.Remoting/NewLife.Remoting.csproj -f net8.0 -c Release --nologo -warnaserror
        dotnet build NewLife.Remoting/NewLife.Remoting.csproj -f net10.0 -c Release --nologo -warnaserror
        dotnet build NewLife.Remoting.Extensions/NewLife.Remoting.Extensions.csproj -f net8.0 -c Release --nologo -warnaserror
        dotnet build NewLife.Remoting.Extensions/NewLife.Remoting.Extensions.csproj -f net10.0 -c Release --nologo -warnaserror
    - name: 源生成器单元测试
      run: dotnet test XUnitTest.SourceGenerator -c Release --nologo

  # 三工程 NativeAOT 冒烟：AotSmoke（核心链路 22 场景）、AotSmoke.Web（最小 API 宿主 11 场景）、
  # AotSmoke.XCode（XCode 设备链路 6 场景，EXT-6 后转硬约束）。JIT 基线先行，再原生发布运行（非 0 退出码即失败）。
  aot:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            bin: AotSmoke.exe
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotSmoke
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            bin: AotSmoke

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Install NativeAOT Prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT Baseline (22 + 11 + 6 场景)
      run: |
        dotnet run -c Release --project AotSmoke/AotSmoke.csproj
        dotnet run -c Release --project AotSmoke.Web/AotSmoke.Web.csproj
        dotnet run -c Release --project AotSmoke.XCode/AotSmoke.XCode.csproj
    - name: Publish NativeAOT (三工程)
      run: |
        dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
        dotnet publish AotSmoke.Web/AotSmoke.Web.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke.Web/bin/aot-out
        dotnet publish AotSmoke.XCode/AotSmoke.XCode.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke.XCode/bin/aot-out
    - name: Run NativeAOT Smoke
      shell: bash
      run: |
        if [[ "${{ matrix.bin }}" == "AotSmoke.exe" ]]; then EXT=".exe"; else EXT=""; fi
        ./AotSmoke/bin/aot-out/AotSmoke$EXT
        ./AotSmoke.Web/bin/aot-out/AotSmoke.Web$EXT
        ./AotSmoke.XCode/bin/aot-out/AotSmoke.XCode$EXT

  # 龙芯 LA64（linux-loongarch64）：无 runtime pack、无 NativeAOT，QEMU 用户态仿真以 JIT 姿态跑核心冒烟（观察期）。
  # 参考 numpy 的跨架构做法：① tonistiigi/binfmt 注册较新的 qemu-user-static（qemu 9.2.2，含 loong64）；
  # ② 业务在 loong64 Debian 容器内执行——容器根文件系统的 glibc/ld.so 与龙芯 SDK 匹配（宿主交叉 glibc 曾遇
  # 「unexpected reloc type」）；③ 容器内下载龙芯 SDK（github.com/loongson/dotnet）。稳定后转硬约束。
  aot-loongarch64:
    name: smoke (linux-la64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Initialize binfmt_misc (QEMU 9.2.2)
      run: docker run --rm --privileged tonistiigi/binfmt:qemu-v9.2.2-52 --install all
    - name: JIT Smoke in LoongArch64 Container (AotSmoke 22 场景)
      run: |
        docker run --rm --platform linux/loong64 -v "$PWD:/src" -w /src \
          cnclarechen/numpy-loong64-debian:v1 \
          /bin/bash -c '
            set -e
            uname -m
            apt-get update -qq -o Acquire::Check-Valid-Until=false -o Acquire::AllowInsecureRepositories=true 2>&1 | tail -1 || true
            apt-get install -y -qq --allow-unauthenticated --no-install-recommends curl ca-certificates openssl >/dev/null 2>&1 || true
            apt-get install -y -qq --allow-unauthenticated --no-install-recommends libssl3t64 >/dev/null 2>&1 || apt-get install -y -qq --allow-unauthenticated libssl3 >/dev/null 2>&1 || true
            URL=https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
            if ! curl -fL -o /tmp/la64-sdk.tar.gz "$URL"; then python3 -c "import urllib.request;urllib.request.urlretrieve(\"$URL\",\"/tmp/la64-sdk.tar.gz\")"; fi
            mkdir -p /usr/share/dotnet && tar -xzf /tmp/la64-sdk.tar.gz -C /usr/share/dotnet
            ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet
            export DOTNET_CLI_TELEMETRY_OPTOUT=1
            # 以 invariant 模式运行，避免依赖容器内 LA64 原生 ICU 数据；冒烟场景不依赖区域性数据
            export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
            dotnet nuget add source https://lnuget.loongnix.cn/v3/index.json -n loongnuget || true
            dotnet --info
            timeout 90m dotnet run -c Release --project AotSmoke/AotSmoke.csproj
          '